name: Automatest Framework CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TARGET: "%regex[.*tests.*],com.practice.tests.**.**,com.practice.tests.**"

jobs:
  Browser_Test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: Chrome
            suffix: chrome-linux
          - os: windows-latest
            browser: Edge
            suffix: edge-windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '23'
          cache: 'maven'

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore Allure history
        uses: actions/cache/restore@v6
        with:
          path: test-output/reports/.allure/history
          key: allure-history-${{ matrix.suffix }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            allure-history-${{ matrix.suffix }}-${{ github.ref_name }}-

      - name: Running Tests
        run: mvn -Dtest="${{ env.TARGET }}" -DExecutionType="LocalHeadless" -DTargetBrowser="${{ matrix.browser }}" clean test

      - name: Save Allure history
        if: always()
        uses: actions/cache/save@v6
        with:
          path: test-output/reports/.allure/history
          key: allure-history-${{ matrix.suffix }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ matrix.suffix }}
          path: test-output/reports/allure-report
          retention-days: 30

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.suffix }}
          path: test-output/logs
          retention-days: 30